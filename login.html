<!DOCTYPE html>
<html lang="en" dir="ltr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Executive Portal Entry | Elite Events</title>
  
  <link rel="icon" type="image/png" href="logo.png">
  <!-- Fonts & Icons -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <link rel="stylesheet" href="style.css">
  <style>
    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: var(--bg-color);
      padding: 40px 20px;
      position: relative;
      overflow-y: auto;
    }

    .auth-bg-blob {
      position: absolute;
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, rgba(99, 102, 241, 0.08) 0%, transparent 70%);
      top: -150px;
      left: -150px;
      border-radius: 50%;
      z-index: 1;
      pointer-events: none;
      filter: blur(50px);
    }

    .auth-card {
      width: 460px;
      max-width: 100%;
      padding: 50px 40px;
      background: var(--bg-card);
      border-radius: var(--border-radius-lg);
      border: 1px solid var(--glass-border);
      box-shadow: var(--shadow-premium);
      backdrop-filter: blur(25px);
      -webkit-backdrop-filter: blur(25px);
      text-align: center;
      position: relative;
      z-index: 10;
      transition: var(--transition-smooth);
    }

    .auth-card:hover {
      border-color: rgba(99, 102, 241, 0.25);
      box-shadow: var(--shadow-hover);
    }

    .auth-card h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      letter-spacing: -0.02em;
    }

    .auth-card p {
      color: var(--text-color-muted);
      font-size: 0.95rem;
      margin-bottom: 35px;
    }

    .auth-form {
      text-align: left;
    }

    .input-group {
      margin-bottom: 25px;
      display: flex;
      flex-direction: column;
      gap: 8px;
    }

    .input-group label {
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      opacity: 0.6;
    }

    .input-group input {
      width: 100%;
      padding: 16px 20px;
      border-radius: var(--border-radius-sm);
      border: 1px solid var(--glass-border);
      background: var(--glass-bg);
      color: var(--text-color);
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      transition: var(--transition-fast);
    }

    .input-group input:focus {
      outline: none;
      border-color: var(--brand-primary);
      box-shadow: 0 0 0 3px rgba(99, 102, 241, 0.15);
      background: rgba(15, 23, 42, 0.3);
    }

    .auth-btn {
      width: 100%;
      background: linear-gradient(135deg, var(--brand-primary) 0%, var(--brand-accent) 100%);
      color: var(--white);
      padding: 16px;
      border: none;
      border-radius: var(--border-radius-sm);
      font-weight: 700;
      font-family: 'Outfit', sans-serif;
      font-size: 0.95rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      cursor: pointer;
      box-shadow: 0 8px 20px rgba(99, 102, 241, 0.2);
      transition: var(--transition-smooth);
      margin-top: 10px;
    }

    .auth-btn:hover {
      transform: translateY(-2px);
      box-shadow: 0 12px 25px rgba(20, 184, 166, 0.35);
    }

    .auth-footer {
      margin-top: 35px;
      font-size: 0.9rem;
      color: var(--text-color-muted);
    }

    .auth-footer a {
      color: var(--brand-accent);
      font-weight: 700;
      transition: var(--transition-fast);
    }

    .auth-footer a:hover {
      color: var(--brand-primary);
      text-decoration: underline;
    }

    .auth-controls-container {
      position: absolute;
      top: 30px;
      right: 30px;
      display: flex;
      gap: 15px;
      z-index: 1000;
    }

    @media (max-width: 500px) {
      body {
        padding: 0;
        background-color: var(--bg-color);
      }
      .auth-card {
        width: 100%;
        min-height: 100vh;
        border-radius: 0;
        border: none;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 60px 25px;
      }
      .auth-controls-container {
        top: 20px;
        right: 20px;
      }
    }
  </style>
</head>
<body data-theme="dark">

  <div class="auth-bg-blob"></div>

  <!-- AUTH CONTROLS -->
  <div class="auth-controls-container">
    <button class="btn-icon-luxe" id="rtl-toggle" title="Switch Direction">LTR</button>
    <button class="btn-icon-luxe" id="theme-toggle" title="Toggle Theme"><i class="fas fa-sun"></i></button>
  </div>

  <div class="auth-card">
    <div style="margin-bottom: 30px; display: flex; justify-content: center;">
      <a href="index.html" class="logo-luxe">
        <div class="logo-icon-box">
          <i class="fas fa-users"></i>
        </div>
        <span class="logo-text">Elite Events</span>
      </a>
    </div>
    
    <h1><span class="text-gradient">Portal Entry</span></h1>
    <p>Please authorize corporate client keys.</p>

    <form class="auth-form" onsubmit="event.preventDefault(); window.location.href='dashboard.html';">
      <div class="input-group">
        <label>Work Email</label>
        <input type="email" placeholder="client@company.com" required>
      </div>
      <div class="input-group">
        <label>Executive Key</label>
        <input type="password" placeholder="••••••••" required>
      </div>
      <button type="submit" class="auth-btn">Authorize Keys</button>
    </form>

    <div class="auth-footer">
      New to our programs? <a href="register.html">Submit RFP Access</a>
    </div>
  </div>

  <script src="script.js"></script>
</body>
</html>
